name: Bug report
description: Report a reproducible problem with DrPanda MCP
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include production credentials, MCP tokens, hostnames, or customer data.
        Security issues must follow SECURITY.md instead of a public issue.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. 1.9.0 or commit hash
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Local (uv run)
        - Reverse proxy / HTTPS
        - Container
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, repeatable steps with redacted data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Redact tokens, secrets, internal hostnames and customer data.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have removed secrets and personal data from this report.
          required: true
        - label: This is not a security vulnerability (see SECURITY.md).
          required: true
