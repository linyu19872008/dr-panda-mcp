name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  database:
    name: database setup (MySQL + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: drpanda_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: drpanda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d drpanda_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Run full setup flow against real databases
        run: uv run python scripts/integration/check_db_setup.py
        env:
          DR_PANDA_TEST_MYSQL_URL: mysql+asyncmy://root:root@127.0.0.1:3306/drpanda_test?charset=utf8mb4
          DR_PANDA_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:root@127.0.0.1:5432/drpanda_test

  package:
    name: build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv build
      - run: ls -lh dist

  docs:
    name: docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash -n scripts/setup.sh
      - name: Check PyPI README is current
        id: pypi_readme
        continue-on-error: true
        run: python scripts/build_pypi_readme.py --check
      - name: Capture expected PyPI README
        if: steps.pypi_readme.outcome == 'failure'
        run: |
          mkdir -p artifacts
          python scripts/build_pypi_readme.py --output artifacts/README.pypi.md.expected
          python scripts/build_pypi_readme.py --check > artifacts/README.pypi.md.diff || true
      - uses: actions/upload-artifact@v4
        if: steps.pypi_readme.outcome == 'failure'
        with:
          name: readme-pypi-expected
          path: artifacts/
      - name: Fail if PyPI README is stale
        if: steps.pypi_readme.outcome == 'failure'
        run: |
          echo "README.pypi.md is stale; download the readme-pypi-expected artifact or run:"
          echo "  python scripts/build_pypi_readme.py"
          exit 1
      - run: python scripts/check_docs_links.py
